<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="QuickNote" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon.svg" />
  <title>QuickNote</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --text: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --bg: #ffffff;
      --bg-secondary: #f9fafb;
      --success: #10b981;
      --error: #ef4444;
      --radius: 12px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* ── ダークモード ── */
    html.dark {
      --bg: #111827;
      --bg-secondary: #1f2937;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --border: #374151;
      --primary-light: #1e1b4b;
      color-scheme: dark;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      transition: background 0.2s, color 0.2s;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* ── トップバー ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(var(--safe-top) + 12px) 16px 12px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      transition: background 0.2s, border-color 0.2s;
    }

    .topbar-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
    }

    .topbar-title svg { width: 24px; height: 24px; }

    .btn-icon {
      width: 40px;
      height: 40px;
      border: none;
      background: var(--bg-secondary);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: background 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-icon:hover, .btn-icon:active { background: var(--primary-light); color: var(--primary); }
    .btn-icon svg { width: 20px; height: 20px; }

    /* ── メインエリア ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #note-input {
      flex: 1;
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      font-size: 17px;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      padding: 20px 20px 12px;
      font-family: inherit;
      transition: background 0.2s, color 0.2s;
    }

    #note-input::placeholder { color: #d1d5db; }
    html.dark #note-input::placeholder { color: #4b5563; }

    /* ── ボトムバー ── */
    .bottombar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px calc(var(--safe-bottom) + 12px);
      border-top: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
      gap: 12px;
      transition: background 0.2s, border-color 0.2s;
    }

    .char-count {
      font-size: 13px;
      color: var(--text-muted);
      min-width: 50px;
    }

    .char-count.warn { color: var(--error); }

    .btn-send {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 24px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 100px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-send:hover { background: var(--primary-hover); }
    .btn-send:active { transform: scale(0.96); }
    .btn-send:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-send svg { width: 16px; height: 16px; }

    /* ── トースト通知 ── */
    .toast {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 80px);
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--text);
      color: white;
      padding: 10px 20px;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--error); }

    /* ── 設定シート ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    .overlay.open { opacity: 1; pointer-events: auto; }

    .sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg);
      border-radius: 20px 20px 0 0;
      z-index: 201;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1), background 0.2s;
      max-height: 90dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .sheet.open { transform: translateY(0); }

    .sheet-handle {
      width: 36px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 12px auto 0;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    /* ── パネルスライダー ── */
    .sheet-panels {
      display: flex;
      transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
      flex: 1;
      min-height: 0;
    }

    .sheet-panels.show-sub { transform: translateX(-100%); }

    .panel {
      min-width: 100%;
      flex-shrink: 0;
      overflow-y: auto;
      padding: 20px 20px calc(var(--safe-bottom) + 24px);
    }

    /* ── パネルヘッダー（サブパネル用） ── */
    .panel-header {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 24px;
    }

    .btn-back {
      display: flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: var(--primary);
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      padding: 4px 8px 4px 0;
      -webkit-tap-highlight-color: transparent;
      margin-right: auto;
    }

    .btn-back svg { width: 18px; height: 18px; }

    .sheet-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
    }

    /* ── 設定一覧（メインパネル） ── */
    .settings-section { margin-bottom: 8px; }

    .settings-section-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0 2px;
      margin-bottom: 4px;
      display: block;
    }

    .settings-list {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .settings-item {
      display: flex;
      align-items: center;
      padding: 13px 14px;
      background: var(--bg-secondary);
      cursor: pointer;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      transition: background 0.12s, border-color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .settings-item:last-child { border-bottom: none; }
    .settings-item:active { background: var(--border); }

    .settings-item-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 16px;
    }

    .settings-item-icon.indigo { background: #e0e7ff; }
    html.dark .settings-item-icon.indigo { background: #1e1b4b; }
    .settings-item-icon.slate  { background: #f1f5f9; }
    html.dark .settings-item-icon.slate  { background: #1e293b; }

    .settings-item-label {
      flex: 1;
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
    }

    .settings-item-value {
      font-size: 14px;
      color: var(--text-muted);
    }

    .settings-chevron {
      color: var(--text-muted);
      opacity: 0.5;
      flex-shrink: 0;
    }

    .settings-chevron svg { width: 16px; height: 16px; display: block; }

    /* ── テーマ選択オプション ── */
    .theme-list {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .theme-option {
      display: flex;
      align-items: center;
      padding: 15px 14px;
      background: var(--bg-secondary);
      cursor: pointer;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      transition: background 0.12s;
      -webkit-tap-highlight-color: transparent;
    }

    .theme-option:last-child { border-bottom: none; }
    .theme-option:active { background: var(--border); }

    .theme-option-label {
      flex: 1;
      font-size: 15px;
      color: var(--text);
    }

    .theme-option-desc {
      font-size: 13px;
      color: var(--text-muted);
    }

    .theme-radio {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.15s, background 0.15s;
    }

    .theme-option.selected .theme-radio {
      border-color: var(--primary);
      background: var(--primary);
    }

    .theme-radio::after {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: white;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .theme-option.selected .theme-radio::after { opacity: 1; }

    /* ── Notion設定フォーム ── */
    .form-group { margin-bottom: 20px; }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-size: 15px;
      font-family: monospace;
      color: var(--text);
      background: var(--bg-secondary);
      outline: none;
      transition: border-color 0.15s, background 0.2s, color 0.2s;
    }

    .form-input:focus { border-color: var(--primary); }
    .form-input::placeholder { color: #9ca3af; font-family: -apple-system, sans-serif; }

    .form-hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.5;
    }

    .btn-save {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 4px;
    }

    .btn-save:hover { background: var(--primary-hover); }

    .sheet-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
      color: var(--text-muted);
      text-decoration: none;
    }

    /* ── 設定未設定バナー ── */
    .setup-banner {
      margin: 16px;
      padding: 14px 16px;
      background: var(--primary-light);
      border: 1.5px solid #c7d2fe;
      border-radius: var(--radius);
      font-size: 14px;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    html.dark .setup-banner { border-color: #3730a3; }
    .setup-banner svg { width: 18px; height: 18px; flex-shrink: 0; }
    .setup-banner.hidden { display: none; }

    /* ── ローディングスピナー ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
  </style>
</head>
<body>

  <!-- トップバー -->
  <header class="topbar">
    <div class="topbar-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
      </svg>
      QuickNote
    </div>
    <button class="btn-icon" id="btn-settings" aria-label="設定">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
    </button>
  </header>

  <!-- メインエリア -->
  <main class="main">
    <div class="setup-banner hidden" id="setup-banner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span>NotionのAPIトークンとDB IDを設定してください</span>
    </div>
    <textarea
      id="note-input"
      placeholder="思い浮かんだことをここに…"
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
    ></textarea>
  </main>

  <!-- ボトムバー -->
  <footer class="bottombar">
    <span class="char-count" id="char-count">0文字</span>
    <button class="btn-send" id="btn-send" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
      Notionへ送信
    </button>
  </footer>

  <!-- トースト -->
  <div class="toast" id="toast"></div>

  <!-- 設定シート -->
  <div class="overlay" id="overlay"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="設定">
    <div class="sheet-handle"></div>

    <div class="sheet-panels" id="sheet-panels">

      <!-- ══ パネル1: 設定一覧 ══ -->
      <div class="panel">
        <h2 class="sheet-title" style="margin-bottom:20px">設定</h2>

        <div class="settings-section" style="margin-bottom:20px">
          <span class="settings-section-label">外観</span>
          <div class="settings-list">
            <div class="settings-item" id="nav-darkmode">
              <div class="settings-item-icon indigo">🌙</div>
              <span class="settings-item-label">ダークモード</span>
              <span class="settings-item-value" id="theme-value-label">システム</span>
              <span class="settings-chevron">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="9 18 15 12 9 6"/>
                </svg>
              </span>
            </div>
          </div>
        </div>

        <div class="settings-section">
          <span class="settings-section-label">連携</span>
          <div class="settings-list">
            <div class="settings-item" id="nav-notion">
              <div class="settings-item-icon slate">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-muted)">
                  <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>
                </svg>
              </div>
              <span class="settings-item-label">Notion接続設定</span>
              <span class="settings-chevron">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="9 18 15 12 9 6"/>
                </svg>
              </span>
            </div>
          </div>
        </div>
      </div>

      <!-- ══ パネル2: サブパネル ══ -->
      <div class="panel" id="panel-sub">

        <!-- サブパネルヘッダー -->
        <div class="panel-header">
          <button class="btn-back" id="btn-back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
            戻る
          </button>
          <h2 class="sheet-title" id="sub-title"></h2>
          <div style="width:52px"></div><!-- 右側スペーサー（タイトルを中央揃えに） -->
        </div>

        <!-- ダークモード選択 -->
        <div id="sub-darkmode" hidden>
          <div class="theme-list">
            <div class="theme-option" data-theme-value="light">
              <span class="theme-option-label">ライト</span>
              <div class="theme-radio"></div>
            </div>
            <div class="theme-option" data-theme-value="system">
              <span class="theme-option-label">システム</span>
              <span class="theme-option-desc">端末の設定に合わせる</span>
              <div class="theme-radio"></div>
            </div>
            <div class="theme-option" data-theme-value="dark">
              <span class="theme-option-label">ダーク</span>
              <div class="theme-radio"></div>
            </div>
          </div>
        </div>

        <!-- Notion接続設定 -->
        <div id="sub-notion" hidden>
          <div class="form-group">
            <label class="form-label" for="input-token">API トークン</label>
            <input class="form-input" id="input-token" type="password" placeholder="ntn_xxxxxxxxxxxx" autocomplete="off" />
            <p class="form-hint">notion.so/my-integrations で取得できます</p>
          </div>
          <div class="form-group">
            <label class="form-label" for="input-db">データベース ID</label>
            <input class="form-input" id="input-db" type="text" placeholder="1e556b42e1d7437cbf623c40cfab2931" autocomplete="off" />
            <p class="form-hint">DBページURLに含まれる32文字の文字列（?v=以降は不要）</p>
          </div>
          <button class="btn-save" id="btn-save">保存する</button>
          <a class="sheet-link" href="https://www.notion.so/my-integrations" target="_blank" rel="noopener">
            インテグレーション管理ページを開く →
          </a>
        </div>

      </div><!-- /panel-sub -->
    </div><!-- /sheet-panels -->
  </div><!-- /sheet -->

  <script>
    // ── 状態管理 ──────────────────────────────────────────────
    const STORAGE_KEY = 'quicknote-settings';

    function loadSettings() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
      catch { return {}; }
    }

    // 既存設定とマージして保存（上書きしない）
    function saveSettings(updates) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...loadSettings(), ...updates }));
    }

    function isConfigured(s) { return !!(s.token && s.databaseId); }

    // ── ダークモード ──────────────────────────────────────────
    const THEME_LABELS = { light: 'ライト', dark: 'ダーク', system: 'システム' };

    function applyTheme(theme) {
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = theme === 'dark' || (theme === 'system' && prefersDark);
      document.documentElement.classList.toggle('dark', isDark);
    }

    // システムテーマ変更を監視
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      const theme = loadSettings().theme || 'system';
      applyTheme(theme);
    });

    // ── DOM 参照 ───────────────────────────────────────────────
    const noteInput       = document.getElementById('note-input');
    const btnSend         = document.getElementById('btn-send');
    const btnSettings     = document.getElementById('btn-settings');
    const charCount       = document.getElementById('char-count');
    const toast           = document.getElementById('toast');
    const overlay         = document.getElementById('overlay');
    const sheet           = document.getElementById('sheet');
    const sheetPanels     = document.getElementById('sheet-panels');
    const btnBack         = document.getElementById('btn-back');
    const subTitle        = document.getElementById('sub-title');
    const themeValueLabel = document.getElementById('theme-value-label');
    const inputToken      = document.getElementById('input-token');
    const inputDb         = document.getElementById('input-db');
    const btnSave         = document.getElementById('btn-save');
    const setupBanner     = document.getElementById('setup-banner');

    // ── 文字数カウント ─────────────────────────────────────────
    noteInput.addEventListener('input', () => {
      const len = noteInput.value.length;
      charCount.textContent = `${len}文字`;
      charCount.classList.toggle('warn', len > 1800);
      btnSend.disabled = len === 0 || !isConfigured(loadSettings());
    });

    // ── シートのパネルナビゲーション ──────────────────────────
    function openSheet() {
      navigateTo('main', false);
      overlay.classList.add('open');
      sheet.classList.add('open');
    }

    function closeSheet() {
      overlay.classList.remove('open');
      sheet.classList.remove('open');
      // 閉じたあとメインに戻す（アニメーション完了後）
      setTimeout(() => navigateTo('main', false), 320);
    }

    function navigateTo(name, animate = true) {
      if (!animate) sheetPanels.style.transition = 'none';

      if (name === 'main') {
        sheetPanels.classList.remove('show-sub');
      } else {
        // サブパネルの中身を切り替える
        document.querySelectorAll('#panel-sub > [id^="sub-"]').forEach(el => el.hidden = true);
        document.getElementById(`sub-${name}`).hidden = false;
        subTitle.textContent = name === 'darkmode' ? 'ダークモード' : 'Notion接続設定';
        sheetPanels.classList.add('show-sub');

        if (name === 'notion') {
          const s = loadSettings();
          if (s.token) inputToken.value = s.token;
          if (s.databaseId) inputDb.value = s.databaseId;
          setTimeout(() => inputToken.focus(), 300);
        }

        if (name === 'darkmode') {
          updateThemeOptions();
        }
      }

      if (!animate) {
        // 次フレームでトランジションを戻す
        requestAnimationFrame(() => {
          requestAnimationFrame(() => { sheetPanels.style.transition = ''; });
        });
      }
    }

    btnSettings.addEventListener('click', openSheet);
    overlay.addEventListener('click', closeSheet);
    setupBanner.addEventListener('click', () => { openSheet(); setTimeout(() => navigateTo('notion'), 50); });
    btnBack.addEventListener('click', () => navigateTo('main'));

    document.getElementById('nav-darkmode').addEventListener('click', () => navigateTo('darkmode'));
    document.getElementById('nav-notion').addEventListener('click', () => navigateTo('notion'));

    // スワイプで閉じる
    let touchStartY = 0;
    sheet.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
    sheet.addEventListener('touchend', (e) => {
      if (e.changedTouches[0].clientY - touchStartY > 60) closeSheet();
    }, { passive: true });

    // ── テーマ選択 ────────────────────────────────────────────
    function updateThemeOptions() {
      const current = loadSettings().theme || 'system';
      document.querySelectorAll('.theme-option').forEach(el => {
        el.classList.toggle('selected', el.dataset.themeValue === current);
      });
    }

    document.querySelectorAll('.theme-option').forEach(el => {
      el.addEventListener('click', () => {
        const value = el.dataset.themeValue;
        saveSettings({ theme: value });
        applyTheme(value);
        themeValueLabel.textContent = THEME_LABELS[value];
        updateThemeOptions();
      });
    });

    // ── Notion設定保存 ────────────────────────────────────────
    btnSave.addEventListener('click', () => {
      const token      = inputToken.value.trim();
      const databaseId = inputDb.value.trim().split('?')[0];

      if (!token || !databaseId) { showToast('トークンとDB IDを入力してください', 'error'); return; }
      if (!token.startsWith('ntn_') && !token.startsWith('secret_')) {
        showToast('トークンの形式が正しくありません', 'error'); return;
      }
      if (databaseId.replace(/-/g, '').length !== 32) {
        showToast('DB IDの形式が正しくありません', 'error'); return;
      }

      saveSettings({ token, databaseId });
      closeSheet();
      updateUI();
      showToast('設定を保存しました ✓', 'success');
    });

    // ── 送信処理 ──────────────────────────────────────────────
    btnSend.addEventListener('click', sendNote);
    noteInput.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') sendNote();
    });

    async function sendNote() {
      const content = noteInput.value.trim();
      if (!content) return;

      const settings = loadSettings();
      if (!isConfigured(settings)) { openSheet(); return; }

      btnSend.disabled = true;
      btnSend.innerHTML = '<div class="spinner"></div>送信中…';

      try {
        const res = await fetch('/.netlify/functions/notion-proxy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: settings.token, databaseId: settings.databaseId, content }),
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.message || '送信に失敗しました');

        noteInput.value = '';
        charCount.textContent = '0文字';
        showToast('Notionに送信しました ✓', 'success');

      } catch (err) {
        showToast(err.message || '送信に失敗しました', 'error');
      } finally {
        btnSend.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>Notionへ送信`;
        btnSend.disabled = noteInput.value.length === 0;
      }
    }

    // ── トースト通知 ──────────────────────────────────────────
    let toastTimer;
    function showToast(message, type = '') {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.className = `toast ${type}`;
      toast.offsetHeight; // 強制リフロー
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
    }

    // ── UI 初期化 ─────────────────────────────────────────────
    function updateUI() {
      const s = loadSettings();
      const configured = isConfigured(s);
      setupBanner.classList.toggle('hidden', configured);
      btnSend.disabled = noteInput.value.length === 0 || !configured;
      const theme = s.theme || 'system';
      themeValueLabel.textContent = THEME_LABELS[theme];
      applyTheme(theme);
    }

    // ── Service Worker 登録 ───────────────────────────────────
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(console.error);
    }

    // 初期化
    updateUI();
    noteInput.focus();
  </script>
</body>
</html>
